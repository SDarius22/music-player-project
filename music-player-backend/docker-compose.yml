services:
  backend:
    image: ${BACKEND_IMAGE}
    ports:
      - "9000:9000"
    environment:
      - DB_HOST=pg-master
      - DB_PORT=5432
      - DB_NAME=music_db
      - DB_USER=music_admin
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - REDIS_HOST=redis
    volumes:
      - /home/deployer/music-player/music_data:/root/music-server
    networks:
      - backend-net
    depends_on:
      - pg-master
      - redis
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.music_storage == true
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 60s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        monitor: 60s
        order: stop-first
      restart_policy:
        condition: on-failure
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s

  pg-master:
    image: postgres:18
    environment:
      - POSTGRES_USER=music_admin
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=music_db
    volumes:
      - /home/deployer/music-player/postgres_data:/var/lib/postgresql
    deploy:
      placement:
        constraints:
          - node.labels.music_storage == true
    restart: unless-stopped
    networks:
      - backend-net

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - backend-net

networks:
  backend-net:
    driver: overlay
