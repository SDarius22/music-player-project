name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - 'music-player-backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    paths:
      - 'music-player-backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-player-backend-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Test deployment helpers
        run: |
          bash deploy/test-frontend-release.sh
          bash deploy/test-rollback-swarm-service.sh
          bash deploy/test-pipeline-contract.sh

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Test and enforce 85% line coverage
        working-directory: ./music-player-backend
        run: mvn --batch-mode clean verify

      - name: Check style
        working-directory: ./music-player-backend
        run: mvn --batch-mode org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check

      - name: Find code defects
        working-directory: ./music-player-backend
        run: mvn --batch-mode com.github.spotbugs:spotbugs-maven-plugin:4.9.8.2:check

      - name: Find code issues and duplication
        working-directory: ./music-player-backend
        run: >-
          mvn --batch-mode
          org.apache.maven.plugins:maven-pmd-plugin:3.28.0:check
          org.apache.maven.plugins:maven-pmd-plugin:3.28.0:cpd-check

      - name: Scan backend dependencies for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: music-player-backend
          skip-dirs: music-player-backend/target
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  build:
    needs: test
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - working-directory: ./music-player-backend
        run: mvn --batch-mode clean package -DskipTests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ./music-player-backend
          push: true
          tags: ghcr.io/sdarius22/music-player-project/music-player-backend:${{ github.sha }}

      - name: Scan the publishable backend image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sdarius22/music-player-project/music-player-backend:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  deploy-cluj:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - id: scp_cluj
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_CLUJ }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "music-player-backend/docker-compose.yml,deploy/verify-swarm-rollout.sh,deploy/preflight-swarm.sh,deploy/rollback-swarm-service.sh"
          target: "/home/deployer/music-player/"
          strip_components: 1

      - id: ssh_cluj
        uses: appleboy/ssh-action@v1.0.0
        env:
          MUSIC_PLAYER_IMAGE: ghcr.io/sdarius22/music-player-project/music-player-backend@${{ needs.build.outputs.digest }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST_CLUJ }}
          MAIL_USER: ${{ secrets.MAIL_USER_CLUJ }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD_CLUJ }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST_CLUJ }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MUSIC_PLAYER_IMAGE,DB_PASSWORD,MAIL_HOST,MAIL_USER,MAIL_PASSWORD,CORS_ALLOWED_ORIGINS,GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            cd /home/deployer/music-player
            bash preflight-swarm.sh music_storage

            mkdir -p goaccess-report

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$MUSIC_PLAYER_IMAGE"

            export BACKEND_IMAGE="$MUSIC_PLAYER_IMAGE"
            export DB_PASSWORD MAIL_HOST MAIL_USER MAIL_PASSWORD CORS_ALLOWED_ORIGINS

            previous_spec_file=$(mktemp)
            if docker service inspect music-player_backend --format '{{json .Spec}}' > "$previous_spec_file" 2>/dev/null; then
              previous_image="$(docker service inspect music-player_backend --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
            else
              rm -f "$previous_spec_file"
              previous_image=
            fi
            docker stack deploy -c docker-compose.yml --with-registry-auth music-player
            if ! bash verify-swarm-rollout.sh music-player_backend "$MUSIC_PLAYER_IMAGE" 2 http://127.0.0.1:9000/api/v1/health; then
              test -n "$previous_image"
              bash rollback-swarm-service.sh music-player_backend "$previous_image" "$previous_spec_file" 2 http://127.0.0.1:9000/api/v1/health
              docker service ps music-player_backend --no-trunc
              docker service logs --tail 100 music-player_backend || true
              exit 1
            fi
            rm -f "$previous_spec_file"

      - name: Validate Cluj deployment
        if: always()
        run: |
          if [ "${{ steps.ssh_cluj.outcome }}" = "success" ]; then
            echo "Cluj VPS deployment succeeded."
          else
            echo "Cluj VPS deployment failed."
            exit 1
          fi
