name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - 'music-player-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Test and enforce 85% line coverage
        working-directory: ./music-player-backend
        run: mvn --batch-mode clean verify

      - name: Check style
        working-directory: ./music-player-backend
        run: mvn --batch-mode org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check

      - name: Find code defects
        working-directory: ./music-player-backend
        run: mvn --batch-mode com.github.spotbugs:spotbugs-maven-plugin:4.9.8.2:check

      - name: Find code issues and duplication
        working-directory: ./music-player-backend
        run: >-
          mvn --batch-mode
          org.apache.maven.plugins:maven-pmd-plugin:3.28.0:check
          org.apache.maven.plugins:maven-pmd-plugin:3.28.0:cpd-check

      - name: Scan backend dependencies for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: music-player-backend
          skip-dirs: music-player-backend/target
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - working-directory: ./music-player-backend
        run: mvn --batch-mode clean package -DskipTests

      - working-directory: ./music-player-backend
        run: docker build -t ghcr.io/sdarius22/music-player-project/music-player-backend:latest .

      - name: Scan the publishable backend image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sdarius22/music-player-project/music-player-backend:latest
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker push ghcr.io/sdarius22/music-player-project/music-player-backend:latest

  # Server 2 first: it owns the primary database and runs Liquibase. Server 1 follows with
  # migrations disabled (its database is a read-only standby).
  deploy:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy-vpn
        with:
          wg-private-key: ${{ secrets.WG_CI_PRIVATE_KEY }}
          ssh-key: ${{ secrets.VPS_SSH_KEY }}
          ssh-user: ${{ secrets.VPS_USER }}

      - name: Deploy to server 2, then server 1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST_CLUJ }}
          MAIL_USER: ${{ secrets.MAIL_USER_CLUJ }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD_CLUJ }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          for target in 10.22.0.10:true 10.22.0.1:false; do
            host=${target%:*} liquibase=${target#*:}
            echo "::group::$host (LIQUIBASE_ENABLED=$liquibase)"
            ssh "$host" 'mkdir -p ~/music-player'
            scp music-player-backend/docker-compose.yml "$host:music-player/docker-compose.yml"
            # Secrets travel over stdin, not the remote command line.
            ssh "$host" bash -s <<EOF
          set -euo pipefail
          cd ~/music-player
          docker info --format '{{.Swarm.LocalNodeState}}' | grep -qx active || docker swarm init
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          docker pull ghcr.io/sdarius22/music-player-project/music-player-backend:latest
          export DB_PASSWORD='$DB_PASSWORD' MAIL_HOST='$MAIL_HOST' MAIL_USER='$MAIL_USER' MAIL_PASSWORD='$MAIL_PASSWORD'
          export CORS_ALLOWED_ORIGINS='$CORS_ALLOWED_ORIGINS' LIQUIBASE_ENABLED=$liquibase
          docker stack deploy -c docker-compose.yml --with-registry-auth music-player
          for i in \$(seq 60); do
            [ "\$(docker service ls --filter name=music-player_backend --format '{{.Replicas}}')" = 2/2 ] && exit 0
            sleep 5
          done
          echo 'music-player_backend did not reach 2/2 replicas' >&2
          docker service ps --no-trunc music-player_backend | head -5 >&2
          exit 1
          EOF
            echo "::endgroup::"
          done
