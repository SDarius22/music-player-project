name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - 'music-player-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Test and enforce 85% line coverage
        working-directory: ./music-player-backend
        run: mvn --batch-mode clean verify

      - name: Check style
        working-directory: ./music-player-backend
        run: mvn --batch-mode org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check

      - name: Find code defects
        working-directory: ./music-player-backend
        run: mvn --batch-mode com.github.spotbugs:spotbugs-maven-plugin:4.9.8.2:check

      - name: Find code issues and duplication
        working-directory: ./music-player-backend
        run: >-
          mvn --batch-mode
          org.apache.maven.plugins:maven-pmd-plugin:3.28.0:check
          org.apache.maven.plugins:maven-pmd-plugin:3.28.0:cpd-check

      - name: Scan backend dependencies for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: music-player-backend
          skip-dirs: music-player-backend/target
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - working-directory: ./music-player-backend
        run: mvn --batch-mode clean package -DskipTests

      - working-directory: ./music-player-backend
        run: docker build -t ghcr.io/sdarius22/music-player-project/music-player-backend:latest .

      - name: Scan the publishable backend image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sdarius22/music-player-project/music-player-backend:latest
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker push ghcr.io/sdarius22/music-player-project/music-player-backend:latest

  # Server 2 first: it owns the primary database and runs Liquibase. Server 1 follows with
  # migrations disabled (its database is a read-only standby).
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: music-player-backend-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy-vpn
        with:
          address: 10.22.0.21
          wg-private-key: ${{ secrets.WG_CI_PRIVATE_KEY }}
          ssh-key: ${{ secrets.VPS_SSH_KEY }}
          ssh-user: ${{ secrets.VPS_USER }}

      - name: Deploy to server 2, then server 1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST_CLUJ }}
          MAIL_USER: ${{ secrets.MAIL_USER_CLUJ }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD_CLUJ }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          for target in 10.22.0.10:true 10.22.0.1:false; do
            host=${target%:*} liquibase=${target#*:}
            echo "::group::$host (LIQUIBASE_ENABLED=$liquibase)"
            ssh "$host" 'mkdir -p ~/music-player/music_data'
            scp music-player-backend/docker-compose.yml "$host:music-player/docker-compose.yml"
            # One session over stdin: %q-quoted exports, then the script. Nothing is written to disk
            # and no secret appears on a command line.
            {
              for v in GHCR_USER GHCR_TOKEN DB_PASSWORD MAIL_HOST MAIL_USER MAIL_PASSWORD CORS_ALLOWED_ORIGINS; do
                printf 'export %s=%q\n' "$v" "${!v}"
              done
              printf 'export LIQUIBASE_ENABLED=%s\n' "$liquibase"
              cat <<'EOF'
          set -euo pipefail
          cd ~/music-player
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          docker info --format '{{.Swarm.LocalNodeState}}' | grep -qx active \
            || docker swarm init --advertise-addr "$(ip -4 -o addr show wg0 | awk '{print $4}' | cut -d/ -f1)"
          docker pull -q ghcr.io/sdarius22/music-player-project/music-player-backend:latest
          # Waits until the rolling update converged (server 1 must not start before server 2 migrated).
          timeout 900 docker stack deploy --detach=false -c docker-compose.yml --with-registry-auth music-player
          test "$(docker service ls --filter name=music-player_backend --format '{{.Replicas}}')" = 2/2
          EOF
            } | ssh "$host" bash -s
            echo "::endgroup::"
          done
