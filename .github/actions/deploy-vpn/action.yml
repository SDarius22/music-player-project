name: Join deploy VPN
description: >-
  Bring up WireGuard to both servers (server 1 = 10.22.0.1, server 2 = 10.22.0.10) and configure
  SSH for them. Deploy steps then use plain `ssh`/`rsync` to those addresses.
inputs:
  wg-private-key:
    description: WireGuard private key of the CI peer (10.22.0.20)
    required: true
  ssh-key:
    description: Deploy SSH private key
    required: true
  ssh-user:
    description: Deploy SSH user
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WG_KEY: ${{ inputs.wg-private-key }}
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_USER: ${{ inputs.ssh-user }}
      run: |
        sudo apt-get install -yq wireguard-tools >/dev/null
        sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
        sudo tee /etc/wireguard/wg0.conf >/dev/null <<EOF
        [Interface]
        Address = 10.22.0.20/32
        PrivateKey = $WG_KEY

        # server 1
        [Peer]
        PublicKey = 9ig8Ce/FTvgcEMePHCFz+WR+vTZUYwGFqqA7nLD4ViA=
        AllowedIPs = 10.22.0.1/32
        Endpoint = vpn.dariussala.com:51820
        PersistentKeepalive = 15

        # server 2
        [Peer]
        PublicKey = l2BX68TAi5q8it1vA25Z+a2ZKmi1PYD/qd5G222kLAY=
        AllowedIPs = 10.22.0.10/32
        Endpoint = vpn.dariussala.com:51821
        PersistentKeepalive = 15
        EOF
        sudo wg-quick up wg0 >/dev/null

        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
        cat > ~/.ssh/config <<EOF
        Host 10.22.0.1 10.22.0.10
          User $SSH_USER
          IdentityFile ~/.ssh/deploy
          IdentitiesOnly yes
          StrictHostKeyChecking accept-new
          ConnectTimeout 15
        EOF
        for host in 10.22.0.10 10.22.0.1; do
          ssh "$host" true && echo "reached $host" || echo "::warning::cannot reach $host over the VPN"
        done
